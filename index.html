<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird - Joxia Games</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>
<body>

    <div id="access-denied" class="hidden">
        <h1>ACCÈS REFUSÉ</h1>
        <p>Tu dois passer par le Hub pour jouer et enregistrer ton score.</p>
        <button onclick="location.href='https://joxiagame.github.io/Joxia-Games/'">RETOUR AU HUB</button>
    </div>

    <div id="game-content">
        <div class="user-bar">
            <span>Joueur : <b id="topNavUser">Chargement...</b></span>
            <button class="exit-btn" onclick="location.href='https://joxiagame.github.io/Joxia-Games/'">QUITTER</button>
        </div>

        <div id="main-container">
            <div id="theme-selector">
                <h2>THÈMES</h2>
                <div class="theme-options">
                    <div class="theme-option active" data-theme="default" style="background: #70c5ce;"></div>
                    <div class="theme-option" data-theme="night" style="background: #2c3e50;"></div>
                    <div class="theme-option" data-theme="desert" style="background: #e67e22;"></div>
                    <div class="theme-option" data-theme="forest" style="background: #27ae60;"></div>
                </div>
            </div>

            <div id="game-area">
                <canvas id="canvas"></canvas>
                <div id="ui">
                    <div id="score">0</div>
                    <div id="overlay">
                        <h1 id="title">Flappy Bird</h1>
                        <button id="startBtn">DÉMARRER</button>
                    </div>
                </div>

                <div id="leaderboard-container" class="hidden">
                    <h2>TOP 10 JOUEURS</h2>
                    <div id="leaderboard">
                        <p>Chargement du classement...</p>
                    </div>
                    <button class="close-lb" onclick="document.getElementById('leaderboard-container').classList.add('hidden')">FERMER</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
