<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird - Joxia</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <div id="main-container">
        <button id="backToHub">RETOUR AU HUB</button>

        <div id="theme-selector">
            <h2>THÈMES</h2>
            <div class="theme-options">
                <div class="theme-option active" data-theme="default" style="background: #70c5ce;"></div>
                <div class="theme-option" data-theme="night" style="background: #2c3e50;"></div>
                <div class="theme-option" data-theme="desert" style="background: #e67e22;"></div>
            </div>
        </div>

        <div id="game-area">
            <canvas id="canvas"></canvas>
            <div id="ui">
                <div id="score">0</div>
                <div id="overlay">
                    <h1 id="title">Flappy Bird</h1>
                    <div id="authContent">
                        <button id="startBtn">DÉMARRER</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="leaderboard-container">
            <h2>TOP 10 PILOTES</h2>
            <div id="leaderboard">
                <p>Chargement...</p>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
