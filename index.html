<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flappy Joxia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>
<body>

    <div id="access-denied" class="hidden">
        <div class="ad-card">
            <h1>ACCÈS REFUSÉ</h1>
            <p>Tu dois passer par le Hub pour jouer et enregistrer ton score.</p>
            <button onclick="location.href='https://joxiagame.github.io/Joxia-Games/'">RETOUR AU HUB</button>
        </div>
    </div>

    <div id="game-content">

        <!-- Barre du haut -->
        <div class="topbar">
            <div class="pill coins-pill"><span class="coin-ico">🪙</span> <b id="coinCount">0</b></div>
            <div class="pill user-pill">👤 <b id="topNavUser">…</b></div>
            <button class="pill exit-btn" onclick="location.href='https://joxiagame.github.io/Joxia-Games/'">QUITTER</button>
        </div>

        <!-- Zone de jeu (canvas + overlays) -->
        <div id="game-area">
            <canvas id="canvas"></canvas>

            <!-- HUD en jeu -->
            <div id="hud">
                <div id="score">0</div>
            </div>

            <!-- Compte à rebours -->
            <div id="countdown" class="hidden"><span id="cd-num">3</span></div>

            <!-- ================= MENU ================= -->
            <div id="menu" class="screen">
                <div class="logo">
                    <span class="logo-flap">FLAPPY</span>
                    <span class="logo-joxia">JOXIA</span>
                </div>
                <p class="tagline">Choisis ton mode et envole-toi ✨</p>

                <div class="mode-grid" id="modeGrid"><!-- injecté --></div>

                <div class="biome-label">Décor</div>
                <div class="biome-row" id="biomeRow"><!-- injecté --></div>

                <button id="playBtn" class="btn-main">▶ JOUER</button>

                <div class="menu-actions">
                    <button class="btn-ghost" id="shopBtn">🎨 Skins</button>
                    <button class="btn-ghost" id="boardBtn">🏆 Classement</button>
                </div>

                <div class="best-line">Meilleur (<span id="bestModeLabel">Classique</span>) : <b id="bestScore">0</b></div>
            </div>

            <!-- ================= BOUTIQUE SKINS ================= -->
            <div id="shop" class="screen hidden">
                <h2 class="screen-title">🎨 Boutique de skins</h2>
                <div class="shop-coins">🪙 <b id="shopCoins">0</b> pièces</div>
                <div class="skin-grid" id="skinGrid"><!-- injecté --></div>
                <button class="btn-ghost close-x" data-close="shop">← Retour</button>
            </div>

            <!-- ================= CLASSEMENT ================= -->
            <div id="board" class="screen hidden">
                <h2 class="screen-title">🏆 Top 10 joueurs</h2>
                <div id="leaderboard"><p class="muted">Chargement…</p></div>
                <button class="btn-ghost close-x" data-close="board">← Retour</button>
            </div>

            <!-- ================= GAME OVER ================= -->
            <div id="gameover" class="screen hidden">
                <h2 class="go-title">GAME OVER</h2>
                <div class="medal" id="medal">🥉</div>
                <div class="go-scores">
                    <div class="go-box"><span>Score</span><b id="finalScore">0</b></div>
                    <div class="go-box"><span>Record</span><b id="finalBest">0</b></div>
                </div>
                <div class="go-coins">+<b id="earnedCoins">0</b> 🪙</div>
                <div class="go-actions">
                    <button id="retryBtn" class="btn-main">↻ Rejouer</button>
                    <button id="menuBtn" class="btn-ghost">Menu</button>
                </div>
            </div>
        </div>

        <!-- Bouton flap mobile (grande zone tactile) -->
        <button id="flapBtn" class="hidden">TAP pour voler 🐤</button>

    </div>

    <script src="game.js?v=5"></script>
</body>
</html>
